[project]
name = "stt-compare"
version = "0.1.0"
description = "Compare fivesight's Whisper against other speech models on the same Indonesian/English clips."
requires-python = ">=3.12,<3.13"
dependencies = [
    "qwen-asr",
    "torch",
    "numpy",
    "soundfile",
    "soxr",
    "jiwer",
    "soundcard",
    "huggingface_hub",
    "onnxruntime>=1.32.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

# CUDA 12.8 builds: the first with Blackwell (RTX 50xx, sm_120) support.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
