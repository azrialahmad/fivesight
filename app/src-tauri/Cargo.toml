[package]
name = "fivesight-app"
version.workspace = true
edition.workspace = true

[lib]
name = "fivesight_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
cuda = ["fs-stt/cuda"]

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
fs-audio = { path = "../../crates/fs-audio" }
fs-stt = { path = "../../crates/fs-stt", features = ["engine"] }
fs-pipeline = { path = "../../crates/fs-pipeline" }
fs-store = { path = "../../crates/fs-store" }
fs-llm = { path = "../../crates/fs-llm" }
fs-bridge = { path = "../../crates/fs-bridge" }
fs-kb = { path = "../../crates/fs-kb" }
fs-atlassian = { path = "../../crates/fs-atlassian" }
futures-util = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls"] }
sha2 = "0.10"
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
] }
tauri-plugin-dialog = "2"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native"] }
