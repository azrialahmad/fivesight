[package]
name = "fivesight-app"
version.workspace = true
edition.workspace = true

[lib]
name = "fivesight_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
cuda = ["fs-stt/cuda"]

[dependencies]
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
fs-audio = { path = "../../crates/fs-audio" }
fs-stt = { path = "../../crates/fs-stt", features = ["engine"] }
fs-pipeline = { path = "../../crates/fs-pipeline" }
fs-store = { path = "../../crates/fs-store" }
fs-llm = { path = "../../crates/fs-llm" }
fs-bridge = { path = "../../crates/fs-bridge" }
fs-kb = { path = "../../crates/fs-kb" }
tauri-plugin-dialog = "2"
getrandom = "0.3"
keyring = { version = "3", features = ["windows-native"] }
