[package]
name = "fivesight-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fivesight-cli"
path = "src/main.rs"

[features]
default = []
engine = ["fs-stt/engine"]
cuda = ["engine", "fs-stt/cuda"]

[dependencies]
anyhow.workspace = true
fs-stt = { path = "../crates/fs-stt" }
fs-atlassian = { path = "../crates/fs-atlassian" }
hound = "3.5.1"
