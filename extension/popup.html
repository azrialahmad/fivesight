<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    :root { --ink: #101010; --muted: #6a6a66; --line: #e2e2da; --paper: #f1f1ec; --lime: #cdf23f; --rec: #c2331c; }
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; padding: 16px; background: #fff; color: var(--ink); font: 13px/1.45 system-ui, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 2px; font-size: 16px; letter-spacing: -0.01em; }
    p { margin: 0; color: var(--muted); }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type="password"], input[type="text"] { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); font: 12px ui-monospace, Consolas, monospace; outline: none; }
    input:focus { border-color: var(--ink); }
    button { margin-top: 10px; padding: 9px 18px; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 600 13px system-ui, sans-serif; cursor: pointer; }
    .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
    .row label { margin: 0; font-weight: 400; color: var(--muted); }
    #status { margin-top: 10px; min-height: 18px; }
    #status.ok { color: var(--ink); font-weight: 600; }
    #status.bad { color: var(--rec); }
    .dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--lime); }
  </style>
</head>
<body>
  <h1>fivesight for Meet</h1>
  <p>Shares who is speaking with the fivesight app on this PC. No audio or video leaves Meet.</p>
  <label for="token">Pairing code</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="From fivesight, Settings, Google Meet" />
  <button id="connect">Connect</button>
  <div id="status" role="status"></div>
  <div class="row"><input id="debug" type="checkbox" /><label for="debug">Debug logging (browser console)</label></div>
  <script src="popup.js"></script>
</body>
</html>
