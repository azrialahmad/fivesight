[workspace]
resolver = "2"
members = ["crates/*", "cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1

# Keep the native inference stack fast even in debug builds.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
