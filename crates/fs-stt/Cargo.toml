[package]
name = "fs-stt"
version.workspace = true
edition.workspace = true

[features]
default = []
engine = ["dep:whisper-rs", "dep:ureq", "dep:base64", "dep:windows-sys"]
cuda = ["engine", "whisper-rs/cuda"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
whisper-rs = { version = "0.16.0", optional = true }
ureq = { version = "3.4", optional = true, default-features = false, features = ["json"] }
base64 = { version = "0.22", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
hound = "3.5.1"

[[example]]
name = "transcribe_chunks"
required-features = ["engine"]
